<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ocraft Web</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="menu">
    <div class="panel">
      <h1>OCRAFT</h1>
      <p>Play Ocraft directly in your browser.</p>
      <button id="playBtn">PLAY</button>
      <p class="help">WASD move · Space jump · Mouse look · Left click mine · Right click place · 1–4 hotbar</p>
    </div>
  </div>

  <div id="hud">
    <div id="crosshair">+</div>
    <div id="hotbar">
      <div class="slot selected" data-slot="0"><span class="swatch grass"></span><b>1</b></div>
      <div class="slot" data-slot="1"><span class="swatch dirt"></span><b>2</b></div>
      <div class="slot" data-slot="2"><span class="swatch stone"></span><b>3</b></div>
      <div class="slot" data-slot="3"><span class="swatch sand"></span><b>4</b></div>
    </div>
  </div>

  <canvas id="game"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
